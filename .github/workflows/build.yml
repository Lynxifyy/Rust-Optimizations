name: Build .so Mod

# Builds the native GlowberryClient acceleration library (libglowberry_rust.so)
# for all four Android ABIs, verifies every artifact is a real ELF shared object
# with the expected JNI bridge, and publishes a versioned bundle. Tag pushes
# (v*) also publish a GitHub Release.

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src/**"
      - "jni/**"
      - "build.rs"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src/**"
      - "jni/**"
      - "build.rs"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo build profile"
        type: choice
        options: [release, dev]
        default: release

concurrency:
  group: build-so-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # aarch64 mandates NEON; the flag is explicit so every ARM artifact ships it.
  RUSTFLAGS: "-C target-feature=+neon"
  NDK_VERSION: "26.1.10909125"
  ANDROID_API_LEVEL: "24"
  LIB_NAME: libglowberry_rust.so

jobs:
  # ---------------------------------------------------------------------------
  # Gate: host-side unit tests exercise the SIMD math, mesher and ring buffer
  # on the runner before we spend time on four cross-compiles.
  # ---------------------------------------------------------------------------
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-tests

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --all-features -- --nocapture

  # ---------------------------------------------------------------------------
  # Cross-compile one shared object per Android ABI.
  # ---------------------------------------------------------------------------
  build-so:
    name: Build ${{ matrix.abi }}
    needs: host-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            features: neon
            expect_machine: AArch64
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            features: neon
            expect_machine: "ARM, EABI5"
          - abi: x86_64
            rust_target: x86_64-linux-android
            features: sse,avx2
            expect_machine: x86-64
          - abi: x86
            rust_target: i686-linux-android
            features: sse
            expect_machine: "Intel 80386"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          ndk_root="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          test -d "${ndk_root}"
          echo "ANDROID_NDK_HOME=${ndk_root}" >> "$GITHUB_ENV"
          echo "NDK_BIN=${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ndk-${{ matrix.rust_target }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cross-compile ${{ matrix.abi }}
        run: |
          cargo ndk \
            -t "${{ matrix.abi }}" \
            --platform "${ANDROID_API_LEVEL}" \
            -o "${GITHUB_WORKSPACE}/jniLibs" \
            build --profile "${{ github.event.inputs.profile || 'release' }}" \
            --features "${{ matrix.features }}" \
            --target "${{ matrix.rust_target }}"

      - name: Stage artifact
        run: |
          mkdir -p "dist/${{ matrix.abi }}"
          cp "jniLibs/${{ matrix.abi }}/${LIB_NAME}" "dist/${{ matrix.abi }}/${LIB_NAME}"

      - name: Verify ELF + JNI symbols
        run: |
          set -euo pipefail
          so="dist/${{ matrix.abi }}/${LIB_NAME}"
          readelf="${NDK_BIN}/llvm-readelf"
          nm="${NDK_BIN}/llvm-nm"

          header="$("${readelf}" -h "${so}")"
          echo "${header}"
          echo "${header}" | grep -q "Shared object file" \
            || { echo "::error::${so} is not an ELF shared object"; exit 1; }
          echo "${header}" | grep -q "${{ matrix.expect_machine }}" \
            || { echo "::error::${so} is not ${{ matrix.expect_machine }}"; exit 1; }

          # Android links against bionic, never glibc.
          if "${readelf}" -s "${so}" | grep -q "GLIBC"; then
            echo "::error::${so} references GLIBC symbols"; exit 1
          fi

          # The JNI bridge entrypoint must be exported by the .so.
          "${nm}" -D --defined-only "${so}" | grep -q "Java_.*init_1rust_1engine" \
            || { echo "::error::${so} is missing init_rust_engine JNI export"; exit 1; }

      - name: Upload ${{ matrix.abi }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: so-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/${LIB_NAME}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Collect every ABI into a single checksummed bundle; release on tags.
  # ---------------------------------------------------------------------------
  package:
    name: Package bundle
    needs: build-so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: so-*
          path: dist

      - name: Build version metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME}"
          case "${GITHUB_REF}" in
            refs/tags/*) version="${GITHUB_REF_NAME}" ;;
            *) version="0.0.0-${GITHUB_SHA::12}" ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Write BUILD_INFO.txt
        run: |
          {
            echo "libglowberry_rust (GlowberryClient native acceleration mod)"
            echo "version: ${{ steps.meta.outputs.version }}"
            echo "git sha: ${GITHUB_SHA}"
            echo "ndk: ${NDK_VERSION} (api ${ANDROID_API_LEVEL})"
            echo "rust: $(rustc --version)"
            echo "profile: ${{ github.event.inputs.profile || 'release' }}"
            echo
            echo "ABIs:"
            find dist -name "${LIB_NAME}" -printf '  %h/%f\n' | sort
          } > dist/BUILD_INFO.txt
          cat dist/BUILD_INFO.txt

      - name: Zip bundle + checksums
        run: |
          set -euo pipefail
          ( cd dist && find . -name "${LIB_NAME}" -print0 \
              | xargs -0 sha256sum > SHA256SUMS.txt )
          bundle="glowberry-rust-${{ steps.meta.outputs.version }}.zip"
          ( cd dist && zip -r "../${bundle}" . )
          echo "BUNDLE=${bundle}" >> "$GITHUB_ENV"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: glowberry-rust-bundle
          path: |
            ${{ env.BUNDLE }}
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUNDLE }}
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          generate_release_notes: true
